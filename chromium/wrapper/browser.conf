# Chromium settings (/media/developer/webosatl/chromium/browser.conf, sourced by mnt/ghb/launch.sh at every start).
# The manager writes this file only if it does not exist, so edits survive updates.
# default page zoom in % for a new profile: 100, 110, 125, 150, 175 or 200 (150: pages lay out like 1280x720 on the 1080p panel). It is written into
# the profile on its first start; later changes need a fresh profile (rm -r /media/developer/webosatl/chromium/profile)
ZOOM=150
# UI scale (integer device scale factor: toolbar, tabs, menus, and pages); page zoom = ZOOM / SCALE
SCALE=2
# first page; empty = the built-in start page (file:///media/developer/webosatl/chromium/mnt/ghb/start/index.html)
START_URL=
# OOM killer preference for every browser process (1000 = killed first, before Home and other apps)
OOM_SCORE_ADJ=1000
# extra Chromium flags
EXTRA_FLAGS=
